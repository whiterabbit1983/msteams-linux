[package]
name = "msteams-tauri"
version = "1.0.0"
description = "Unofficial Microsoft Teams desktop wrapper built with Tauri"
authors = ["msteams-tauri contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "msteams_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
