name: release

# Builds the Linux AppImage and publishes it to a GitHub release.
#
#   push a tag matching v*       -> check, build, publish a release for that tag
#   workflow_dispatch            -> check, build, publish (prerelease); optionally
#                                   pass a tag in the "tag" input to update that
#                                   release instead
#   pull request touching Rust/  -> check only, nothing is published
#     JS sources
#
# Both local and CI AppImages bundle the WebRTC-enabled WebKitGTK built by
# scripts/build-webrtc-webkit.sh; distro WebKitGTK does not provide WebRTC.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish under (defaults to a build-<run> prerelease tag)"
        required: false
        type: string
  pull_request:
    paths:
      - "src-tauri/**"
      - "dist/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release.yml"
      - "tests/**"

# Least privilege: only the publish job may write to the repository.
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            librsvg2-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check build scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s tests -v
          node --test tests/*.test.mjs

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

  build-appimage:
    name: Build AppImage
    # Skipped for pull requests: those only run the checks above.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # A manual run may ask for a tag other than the checked-out ref, so all
          # tags have to be available for the checkout below.
          fetch-depth: 0

      - name: Check out the requested tag
        # On a manual run the workflow may have been started from a branch while
        # the user asked for a specific tag, so check that tag out explicitly.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            git fetch --depth 1 origin "refs/tags/${{ inputs.tag }}:refs/tags/${{ inputs.tag }}"
            git checkout "${{ inputs.tag }}"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            squashfs-tools \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good \
            gstreamer1.0-nice \
            gstreamer1.0-alsa \
            gstreamer1.0-gl \
            gstreamer1.0-pipewire \
            gstreamer1.0-pulseaudio \
            xvfb \
            xauth \
            pulseaudio \
            pulseaudio-utils \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Restore AppImage tooling
        id: appimage-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/tauri
          key: tauri-appimage-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Restore compiled WebRTC-enabled WebKitGTK
        id: webkit-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .webrtc-webkit/install
          key: webrtc-webkit-install-${{ runner.os }}-${{ hashFiles('scripts/build-webrtc-webkit.sh', 'scripts/webrtc-packages.sh', 'scripts/install-webrtc-deps.sh', 'scripts/webkitgtk-relocatable.patch') }}

      - name: Install and validate all WebKitGTK dependencies
        shell: bash
        run: |
          sudo bash scripts/install-webrtc-deps.sh 2>&1 | tee dependencies-build.log
          bash scripts/check-webrtc-deps.sh

      - name: Configure WebKitGTK and validate dependency versions
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./scripts/build-webrtc-webkit.sh --system-deps --configure-only 2>&1 | tee configure-build.log

      - name: Populate AppImage tooling
        run: npx tauri build --bundles appimage

      - name: Save AppImage tooling before runtime tests
        if: steps.appimage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/tauri
          key: ${{ steps.appimage-cache.outputs.cache-primary-key }}

      - name: Build WebRTC-enabled WebKitGTK
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake --build .webrtc-webkit/build --parallel 2 2>&1 | tee webkit-build.log
          cmake --install .webrtc-webkit/build 2>&1 | tee -a webkit-build.log

      - name: Save compiled WebKitGTK before runtime tests
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .webrtc-webkit/install
          key: ${{ steps.webkit-cache.outputs.cache-primary-key }}

      - name: Build the AppImage
        shell: bash
        run: ./scripts/build-appimage.sh 2>&1 | tee appimage-build.log

      - name: Test the packaged WebRTC runtime
        shell: bash
        run: |
          # A hosted runner has no sound device or running audio daemon. Give
          # WebAudio a real PulseAudio server backed by a virtual null sink.
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/msteams-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 --log-target="file:$PWD/pulseaudio.log"
          trap 'pulseaudio --kill || true' EXIT
          export PULSE_SERVER="unix:$XDG_RUNTIME_DIR/pulse/native"
          pactl load-module module-null-sink sink_name=webrtc_ci rate=48000 channels=2
          pactl set-default-sink webrtc_ci
          pactl set-default-source webrtc_ci.monitor
          pactl info
          export ALSOFT_DRIVERS=pulse
          export LIBGL_ALWAYS_SOFTWARE=1
          export GST_DEBUG=2
          timeout 90 dbus-run-session -- xvfb-run -a ./Microsoft_Teams-x86_64.AppImage \
            --appimage-extract-and-run --webrtc-smoke 2>&1 | tee webrtc-smoke.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-diagnostics
          path: |
            *-build.log
            webrtc-smoke.log
            pulseaudio.log
            .webrtc-webkit/build/CMakeFiles/CMakeConfigureLog.yaml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unverified AppImage on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unverified-appimage
          path: Microsoft_Teams-*.AppImage
          if-no-files-found: ignore
          retention-days: 3

      - name: Collect the artifact
        run: |
          mkdir -p dist
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          mv Microsoft_Teams-x86_64.AppImage "dist/Microsoft_Teams-${version}-x86_64.AppImage"
          ls -la dist

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build-appimage
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the AppImage
        uses: actions/download-artifact@v8.0.2
        with:
          name: appimage
          path: dist

      - name: Resolve the release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          # A manual run without an explicit tag is just a build, not a release.
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
          draft: false
          generate_release_notes: true
          files: dist/*.AppImage