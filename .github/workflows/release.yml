name: release

# Builds the Linux AppImage and publishes it to a GitHub release.
#
#   push a tag matching v*       -> check, build, publish a release for that tag
#   workflow_dispatch            -> check, build, publish (prerelease); optionally
#                                   pass a tag in the "tag" input to update that
#                                   release instead
#   pull request touching Rust/  -> check only, nothing is published
#     JS sources
#
# Both local and CI AppImages bundle the WebRTC-enabled WebKitGTK built by
# scripts/build-webrtc-webkit.sh; distro WebKitGTK does not provide WebRTC.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish under (defaults to a build-<run> prerelease tag)"
        required: false
        type: string
      webrtc_smoke:
        description: "Run the optional packaged WebRTC smoke test (may block publication)"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "src-tauri/**"
      - "dist/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - "tests/**"

# Only the AppImage publisher and isolated dependency producer may write releases.
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            librsvg2-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check build scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s tests -v
          node --test tests/*.test.mjs

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

  prepare-webkit:
    name: Ensure the permanent WebKitGTK dependency
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/webkit.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
    permissions:
      contents: write

  build-appimage:
    name: Build AppImage
    # Skipped for pull requests: those only run the checks above.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: prepare-webkit
    runs-on: ubuntu-24.04
    outputs:
      webrtc_smoke_status: ${{ steps.webrtc-smoke.outcome }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            squashfs-tools \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good \
            gstreamer1.0-nice \
            gstreamer1.0-alsa \
            gstreamer1.0-gl \
            gstreamer1.0-pipewire \
            gstreamer1.0-pulseaudio \
            xvfb \
            xauth \
            xdotool \
            pulseaudio \
            pulseaudio-utils \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Restore AppImage tooling
        id: appimage-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/tauri
          key: tauri-appimage-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Download and verify the versioned WebKitGTK install
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_TAG: ${{ needs.prepare-webkit.outputs.bundle_tag }}
        run: |
          destination="$RUNNER_TEMP/webkit-download"
          mkdir -p "$destination"
          gh release download "$BUNDLE_TAG" \
            --pattern "$BUNDLE_TAG.tar.gz" --pattern "$BUNDLE_TAG.tar.gz.sha256" \
            --dir "$destination"
          python3 scripts/webkit-bundle.py unpack --archive "$destination/$BUNDLE_TAG.tar.gz"

      - name: Install and validate all WebKitGTK dependencies
        shell: bash
        run: |
          sudo bash scripts/install-webrtc-deps.sh 2>&1 | tee dependencies-build.log
          bash scripts/check-webrtc-deps.sh

      - name: Populate AppImage tooling only on a cache miss
        if: steps.appimage-cache.outputs.cache-hit != 'true'
        run: npx tauri build --bundles appimage

      - name: Save AppImage tooling before runtime tests
        if: steps.appimage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/tauri
          key: ${{ steps.appimage-cache.outputs.cache-primary-key }}

      - name: Build the AppImage
        shell: bash
        run: ./scripts/build-appimage.sh 2>&1 | tee appimage-build.log

      - name: Test packaged application startup (not WebRTC)
        shell: bash
        run: bash scripts/check-appimage-startup.sh ./Microsoft_Teams-x86_64.AppImage

      - name: Test real chat-link clicks and host-browser dispatch (not WebRTC)
        shell: bash
        run: bash scripts/check-appimage-links.sh ./Microsoft_Teams-x86_64.AppImage

      - name: Test the packaged WebRTC runtime (optional)
        id: webrtc-smoke
        if: github.event_name == 'workflow_dispatch' && inputs.webrtc_smoke
        shell: bash
        run: |
          # A hosted runner has no sound device or running audio daemon. Give
          # WebAudio a real PulseAudio server backed by a virtual null sink.
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/msteams-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 --log-target="file:$PWD/pulseaudio.log"
          trap 'pulseaudio --kill || true' EXIT
          export PULSE_SERVER="unix:$XDG_RUNTIME_DIR/pulse/native"
          pactl load-module module-null-sink sink_name=webrtc_ci rate=48000 channels=2
          pactl set-default-sink webrtc_ci
          pactl set-default-source webrtc_ci.monitor
          pactl info
          export ALSOFT_DRIVERS=pulse
          export LIBGL_ALWAYS_SOFTWARE=1
          export GST_DEBUG=2
          export GST_DEBUG_NO_COLOR=1
          timeout 90 dbus-run-session -- xvfb-run -a ./Microsoft_Teams-x86_64.AppImage \
            --appimage-extract-and-run --webrtc-smoke 2>&1 | tee webrtc-smoke.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-diagnostics
          path: |
            *-build.log
            webrtc-smoke.log
            startup-smoke.log
            links-smoke.log
            pulseaudio.log
            .webrtc-webkit/build/CMakeFiles/CMakeConfigureLog.yaml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unverified AppImage on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unverified-appimage
          path: Microsoft_Teams-*.AppImage
          if-no-files-found: ignore
          retention-days: 3

      - name: Collect the artifact
        run: |
          mkdir -p dist
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          mv Microsoft_Teams-x86_64.AppImage "dist/Microsoft_Teams-${version}-x86_64.AppImage"
          ls -la dist

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [check, build-appimage]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the AppImage
        uses: actions/download-artifact@v8.0.2
        with:
          name: appimage
          path: dist

      - name: Resolve the release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          # A manual run without an explicit tag is just a build, not a release.
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
          draft: false
          generate_release_notes: true
          body: |
            ${{ needs.build-appimage.outputs.webrtc_smoke_status == 'success' && 'The optional WebRTC smoke test passed in Linux CI. Real Teams calls were not tested.' || 'WebRTC smoke testing was skipped for this release. Audio/video calling has not been verified.' }}
          files: dist/*.AppImage